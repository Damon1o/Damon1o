<header class="navbar" id="navbar">
    <a href="{{ url_for('index') }}" class="nav-logo">
        <span class="nav-logo-text">Damon Lin</span>
    </a>

    {% set nav_items = [('index', 'Home'), ('projects', 'Projects'), ('experience', 'Experience'), ('about', 'About'), ('contact', 'Contact')] %}
    <nav class="nav-links">
        {% for endpoint, label in nav_items %}
        <a href="{{ url_for(endpoint) }}" class="nav-link"{% if request.endpoint == endpoint %} aria-current="page"{% endif %}>{{ label }}</a>
        {% endfor %}
    </nav>

    <div class="nav-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode" title="Toggle theme">
            <svg class="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <svg class="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </button>
        <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false" aria-controls="mobileMenu">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
        </button>
    </div>

    <div class="mobile-menu" id="mobileMenu">
        {% for endpoint, label in nav_items %}
        <a href="{{ url_for(endpoint) }}" class="mobile-nav-link"{% if request.endpoint == endpoint %} aria-current="page"{% endif %}>{{ label }}</a>
        {% endfor %}
    </div>
</header>
